[project]
name = "inbox"
version = "0.1.0"
description = "Smart folder for dropping stuff"
readme = "README.md"
authors = [
    { name = "Dmitrii Mukhutdinov", email = "flyingleafe@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asgiref>=3.9.1",
    "inotify>=0.2.12",
    "notify-py>=0.3.43",
]

[project.scripts]
inbox = "inbox:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
